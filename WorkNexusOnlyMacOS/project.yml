name: WorkNexusOnlyMacOS
options:
  bundleIdPrefix: com.worknexus
  deploymentTarget: { macOS: "15.0" }
  createIntermediateGroups: true
packages:
  WorkNexusKit: { path: Packages/WorkNexusKit }
settings:
  base:
    SWIFT_VERSION: 5.0
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_HARDENED_RUNTIME: NO
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
configFiles: {}
targets:
  WorkNexus:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Assets.xcassets
      - path: App/Resources/Localizable.xcstrings
      - { path: App/Resources/Fonts, type: folder, buildPhase: resources }
      - { path: App/Resources/Brands, type: folder, buildPhase: resources }
      - { path: App/Resources/Stickers, type: folder, buildPhase: resources }
      - { path: App/Resources/Tray, type: folder, buildPhase: resources }
      - { path: App/Resources/Pet, type: folder, buildPhase: resources }
      - { path: App/Resources/Mcp, type: folder, buildPhase: resources }
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: WorkNexus Mac
        CFBundleShortVersionString: "1.9.26"
        CFBundleVersion: "47"
        LSMinimumSystemVersion: "15.0"
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMultipleInstancesProhibited: true
        NSHighResolutionCapable: true
        NSAppTransportSecurity: { NSAllowsArbitraryLoads: true }
        ATSApplicationFontsPath: Fonts
        NSMicrophoneUsageDescription: Used by mini apps that request the microphone.
        NSCameraUsageDescription: Used by mini apps that request the camera.
    entitlements:
      path: App/WorkNexus.entitlements
      properties:
        com.apple.security.app-sandbox: false   # same as the Flutter build: spawns CLIs, reads browser cookie DBs
        com.apple.security.network.client: true
        com.apple.security.network.server: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.worknexus.macos
        PRODUCT_NAME: WorkNexusMac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: WorkNexusKit
        product: WorkNexusKit
schemes:
  WorkNexus:
    build: { targets: { WorkNexus: all } }
    run: { config: Debug }
    test: { config: Debug }
